# פריסת אתר הטיול ב-Netlify.
# האתר סטטי לחלוטין — אין שלב בנייה, מפרסמים את התיקייה כמו שהיא.

[build]
  publish = "."
  command = ""

# Leaflet ונכסי הספרייה אינם משתנים — אפשר לשמור אותם במטמון לאורך זמן.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# הקוד והתוכן של האתר משתנים בין פריסות — תמיד לאמת מול השרת.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
