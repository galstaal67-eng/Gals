# Netlify — פריסת אתר הטיול שבתיקיית trip/.
#
# הקובץ יושב בשורש המאגר בכוונה, כדי שחיבור המאגר ב-Netlify יעבוד ללא שום
# הגדרה ידנית: אין צורך לקבוע Base directory או Publish directory בממשק.
# מערכת ה-SOX שבשאר המאגר אינה נפרסת ב-Netlify ואינה מושפעת מהקובץ הזה.

[build]
  publish = "trip"
  command = ""

# Leaflet ונכסי הספרייה אינם משתנים — אפשר לשמור אותם במטמון לאורך זמן.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# הקוד והתוכן של האתר משתנים בין פריסות — תמיד לאמת מול השרת.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
