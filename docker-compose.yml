services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sox
      POSTGRES_PASSWORD: sox
      POSTGRES_DB: sox
    ports:
      - "5432:5432"
    volumes:
      - sox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sox"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sox:sox@db:5432/sox
      JWT_SECRET_KEY: dev-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      EMAIL_PROVIDER: console
      AI_PROVIDER: heuristic
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  sox_pgdata:
