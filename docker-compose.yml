services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sox
      POSTGRES_PASSWORD: sox
      POSTGRES_DB: sox
    ports:
      - "5432:5432"
    volumes:
      - sox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sox"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sox_pgdata:
